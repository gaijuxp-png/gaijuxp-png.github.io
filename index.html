<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<title>HelpCommerce</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <img class="brand-logo" src="helpcommerce-logo-preview.png" alt="Logo da HelpCommerce">
  <div>
    <h1>HelpCommerce</h1>
    <p>Controle suas finanças. Cresça seu negócio.</p>
  </div>
</header>
<main class="container">
  <section class="summary-grid">
    <article class="card"><h2>Receitas</h2><strong id="total-income">R$ 0,00</strong></article>
    <article class="card"><h2>Despesas</h2><strong id="total-expense">R$ 0,00</strong></article>
    <article class="card"><h2>Saldo</h2><strong id="net-total">R$ 0,00</strong></article>
  </section>
  <section class="panel">
    <h2>Nova transação</h2>
    <form id="transaction-form" novalidate>
      <label for="description">Descrição</label>
      <input id="description" name="description" type="text" maxlength="80" autocomplete="off" required>
      <small id="description-error" class="field-error"></small>
      <label for="amount">Valor</label>
      <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required>
      <small id="amount-error" class="field-error"></small>
      <label for="type">Tipo</label>
      <select id="type" name="type" required>
        <option value="">Selecione</option>
        <option value="income">Receita</option>
        <option value="expense">Despesa</option>
      </select>
      <small id="type-error" class="field-error"></small>
      <label for="category">Categoria</label>
      <select id="category" name="category" required>
        <option value="">Selecione</option>
        <option value="salario">Salário</option>
        <option value="freelance">Freelance</option>
        <option value="vendas">Vendas</option>
        <option value="marketing">Marketing</option>
        <option value="operacional">Operacional</option>
        <option value="outros">Outros</option>
      </select>
      <small id="category-error" class="field-error"></small>
      <button class="btn-primary" type="submit">Adicionar transação</button>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </form>
  </section>
  <section class="panel">
    <div class="section-head">
      <h2>Transações</h2>
      <button id="clear-all" class="btn-secondary" type="button">Limpar tudo</button>
    </div>
    <ul id="transactions-list" class="transactions"></ul>
  </section>
</main>
<script src="script.js" defer></script>
</body>
</html>
